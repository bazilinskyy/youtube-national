name: Lint codebase

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Super-Linter
        uses: super-linter/super-linter@v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Lint only changed files against default branch
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main

          # Make SL pick configs from here (mypy, jscpd, etc.)
          LINTER_RULES_PATH: .github/linters

          # Optional: focus on your real package directory
          FILTER_REGEX_INCLUDE: ^workspace/
          FILTER_REGEX_EXCLUDE: '.*\.md$'

          # >>> INCLUDE MODE: enable only the linters you want <<<
          VALIDATE_PYTHON_MYPY: true
          VALIDATE_COPYPASTE_JSCPD: true
