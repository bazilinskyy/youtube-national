name: Lint codebase

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Super-Linter
        uses: super-linter/super-linter@v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Keep to "changed files" on PRs for speed; set to true if you want full runs
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main

          # Look for linter configs here
          LINTER_RULES_PATH: .github/linters

          # Limit scanning to your actual Python package so mypy sees one root
          FILTER_REGEX_INCLUDE: ^workspace/
          FILTER_REGEX_EXCLUDE: '.*\.md$'

          # Explicit which linters to run
          VALIDATE_PYTHON_MYPY: true
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_COPYPASTE_JSCPD: true
