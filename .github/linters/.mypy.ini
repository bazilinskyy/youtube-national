[mypy]
python_version = 3.11

# Analyze only your package; avoid scanning the repo root
packages = workspace

# Make module resolution strict so a file can't be discovered twice
explicit_package_bases = True
no_namespace_packages = True

# Hygiene exclusions
exclude = (?x)(
    ^\.venv/|
    ^venv/|
    ^build/|
    ^dist/|
    ^node_modules/
)

# Optional: be stricter/looser as you like
warn_unused_ignores = True
warn_redundant_casts = True
disallow_untyped_defs = False
